name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks the whole front end, then runs the regression suite:
      # the template compiler, the file-intent gates, chain detection and
      # the deterministic edit parser, all without a model or a network.
      - run: npm run verify
